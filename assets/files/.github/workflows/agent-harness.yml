# ============================================================
# ROLE: agent-harness gates on every PR: commits, OpenSpec flow, managed files, audit
# DEPENDS ON: @aimha/agent-harness (sync, check-flow, commitlint, openspec commands), .nvmrc
# USED BY: GitHub Actions on PRs to main, develop and feature/**, and on pushes to main and develop
# KEY DECISIONS: only the package's own gates live here; lint, build and test belong to
#   the project's own workflow, which knows the stack. Actions pinned to SHA (supply
#   chain); audit on production dependencies of the root lockfile only
# GOTCHAS: the branch names come from github.head_ref and github.base_ref and are
#   untrusted input: always pass them through environment variables, never interpolate
#   them in the script. Generated by agent-harness sync: do not edit, project jobs go
#   in another workflow file. Needs .nvmrc at the project root
# LAST UPDATED: 2026-10-22 - split from the project CI, develop and feature/** branches
# ============================================================
name: agent-harness

on:
  pull_request:
    branches: [main, develop, 'feature/**']
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: agent-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-harness:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- agent-harness commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Commit messages (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: npx --no -- agent-harness commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose

      - name: Flusso OpenSpec (branch, spec, archivio, summary)
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- agent-harness check-flow "$BRANCH" "$BASE_SHA" "$HEAD_SHA" "$BASE_BRANCH"

      - name: File gestiti da agent-harness allineati
        run: npx --no -- agent-harness sync --check

      - name: OpenSpec validate
        run: |
          npx --no -- agent-harness openspec validate --all --strict --no-interactive
          npx --no -- agent-harness openspec validate --archived --no-interactive

      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
